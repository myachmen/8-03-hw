apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-data-sc
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage-local
  hostPath:
    path: /mnt/data-sc
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-data-sc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: storage-local
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date)" >> /data/output.txt
                sleep 5
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /data

        - name: multitool
          image: wbitt/network-multitool:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - "tail -f /data/output.txt"
          volumeMounts:
            - name: persistent-data
              mountPath: /data

      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: pvc-data-sc
